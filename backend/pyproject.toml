[project]
name = "graph8-backend"
version = "0.1.0"
description = "graph8 Self-Healing Outbound Agent Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.3.0",
    "langgraph>=0.0.30",
    "openai>=1.14.0",
    "groq>=0.5.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "main:app"

[tool.fastapi]
entrypoint = "main:app"
